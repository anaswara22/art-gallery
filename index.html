<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Gallery</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">ArtGallery</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item" id="galleryLink" style="display:none;"><a class="nav-link" href="gallery.html">Gallery</a></li>
        <li class="nav-item" id="loginLink"><a class="nav-link" href="login.html">Login</a></li>
        <li class="nav-item" id="signupLink"><a class="nav-link" href="signup.html">Sign Up</a></li>
        <li class="nav-item" id="logoutLink" style="display:none;">
          <a class="nav-link" href="#" id="logoutBtn">Logout</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<header class="bg-dark text-white text-center py-5">
  <h1>Welcome to the Art Gallery</h1>
  <p>Explore timeless pieces of art</p>
  <a href="#" id="exploreBtn" class="btn btn-primary mt-3">Explore Gallery</a>
</header>

<script>
  const exploreBtn = document.getElementById('exploreBtn');
  const loginLink = document.getElementById('loginLink');
  const signupLink = document.getElementById('signupLink');
  const logoutLink = document.getElementById('logoutLink');
  const galleryLink = document.getElementById('galleryLink');

  // Explore button logic
  exploreBtn.addEventListener('click', function(e) {
    e.preventDefault();
    if(localStorage.getItem('loggedIn') === 'true') {
      window.location.href = 'gallery.html';
    } else {
      window.location.href = 'login.html';
    }
  });

  // Navbar visibility based on login state
  if(localStorage.getItem('loggedIn') === 'true') {
    loginLink.style.display = 'none';
    signupLink.style.display = 'none';
    logoutLink.style.display = 'block';
    galleryLink.style.display = 'block';
  } else {
    loginLink.style.display = 'block';
    signupLink.style.display = 'block';
    logoutLink.style.display = 'none';
    galleryLink.style.display = 'none';
  }

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', function() {
    localStorage.removeItem('loggedIn');
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
